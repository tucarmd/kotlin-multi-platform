# [App 5 · B6] Regenerate the Xcode project after editing this file: `xcodegen generate` (in iosApp/)
name: iosApp
options:
  bundleIdPrefix: dev.obdlink
  deploymentTarget:
    iOS: "17.0" # @Observable needs iOS 17
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "5.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: OBD Link
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        # PLATFORM: without this key iOS kills the app the moment CoreBluetooth starts (first scan).
        # The text is what the system permission prompt shows.
        NSBluetoothAlwaysUsageDescription: OBD Link uses Bluetooth to talk to your ELM327 OBD-II dongle.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.obdlink.ios
        PRODUCT_NAME: ObdLink
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # TRAP: "generic/platform=iOS Simulator" builds arm64 AND x86_64; Gradle only has iosSimulatorArm64,
        # so embedAndSign fails with "Xcode Requested Architecture Not Configured in Gradle". Apple-silicon only.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        # Shared is a static framework built by Gradle (preBuildScripts below), linked here by name.
        # CoreBluetooth: Kable's iOS code lives inside Shared, but the system framework must be linked by the app.
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared", "-framework", "CoreBluetooth"]
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
