# [App 3 · B6] Regenerate the Xcode project after editing this file: `xcodegen generate` (in iosApp/)
name: iosApp
options:
  bundleIdPrefix: dev.ratewatch
  deploymentTarget:
    iOS: "17.0" # @Observable needs iOS 17
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "5.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Rate Watch
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ratewatch.ios
        PRODUCT_NAME: RateWatch
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        # Shared is a static framework, so the system SQLite used by SQLDelight must be linked here too
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared", "-lsqlite3"]
        # Gradle builds only iosSimulatorArm64 (Apple Silicon). A 'generic/platform=iOS Simulator' build also asks for
        # x86_64 and the Kotlin script stops with "Requested Architecture Not Configured", so build arm64 only.
        "ARCHS[sdk=iphonesimulator*]": arm64
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
