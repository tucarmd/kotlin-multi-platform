# [App 2 · B6] Regenerate the Xcode project after editing this file: `xcodegen generate` (in iosApp/)
name: iosApp
options:
  bundleIdPrefix: dev.pocketnotes
  deploymentTarget:
    iOS: "17.0" # @Observable and ContentUnavailableView need iOS 17
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "5.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Pocket Notes
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pocketnotes.ios
        PRODUCT_NAME: PocketNotes
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        # TRAP: Shared is a STATIC framework, so its dependency on the system SQLite (SQLDelight's NativeSqliteDriver)
        # must be linked by the app itself. Without -lsqlite3: "Undefined symbols: _sqlite3_open_v2 ..." at link time.
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared", "-lsqlite3"]
        # TRAP: `-destination 'generic/platform=iOS Simulator'` builds arm64 AND x86_64, but shared/ only has
        # iosSimulatorArm64() (Apple Silicon). Without this line Gradle stops with
        # "Xcode Requested Architecture Not Configured in Gradle".
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
