# [App 0 · 1.1] Regenerate the Xcode project after editing this file: `xcodegen generate` (in iosApp/)
name: iosApp
options:
  bundleIdPrefix: dev.hellokmp
  deploymentTarget:
    iOS: "17.0" # @Observable needs iOS 17
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "5.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Hello KMP
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hellokmp.ios
        PRODUCT_NAME: HelloKmp
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        # Shared is a static framework built by Gradle (preBuildScripts below), linked here by name
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        # Gradle only builds iosSimulatorArm64. "Any iOS Simulator" in Xcode also asks for x86_64 and fails with
        # "Xcode Requested Architecture Not Configured in Gradle", so the simulator build skips x86_64.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # This is where shared/ gets embedded: before compiling Swift, Xcode asks Gradle to build Shared.framework.
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
