site_name: Học Kotlin Multiplatform
site_description: Học Kotlin Multiplatform bằng cách làm một app đo pin, GPS và mạng (Device Pulse) chạy Android và iOS — theo đúng lộ trình docs chính chủ của Kotlin.
site_url: https://tucarmd.github.io/kotlin-multi-platform/
repo_url: https://github.com/tucarmd/kotlin-multi-platform
repo_name: tucarmd/kotlin-multi-platform
edit_uri: edit/main/docs/
# Xem ở máy: mkdocs serve · Đăng: push main → GitHub Actions (.github/workflows/pages.yml)
docs_dir: docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  language: vi
  custom_dir: overrides
  font:
    text: Figtree
    code: JetBrains Mono
  icon:
    logo: material/language-kotlin
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Chế độ tối }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Chế độ sáng }

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.details
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - hooks/lesson_bar.py

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tucarmd/kotlin-multi-platform
      name: Mã nguồn trên GitHub
    - icon: fontawesome/solid/book
      link: https://kotlinlang.org/docs/multiplatform/get-started.html
      name: Docs Kotlin Multiplatform chính chủ

nav:
  - "Trang chủ": index.md
  - "Playground": playground/index.html
  - "Lộ trình":
      - roadmap.md
      - "Sơ đồ lộ trình": roadmap-map.md
      - "1. KMP là gì, khi nào dùng": lessons/01-what-is-kmp.md
      - "2. Cài máy, tạo project đầu tiên": lessons/02-setup.md
      - "3. Cấu trúc project": lessons/03-project-structure.md
      - "4. Chia sẻ code: model và luật": lessons/04-share-code.md
      - "5. Thêm thư viện": lessons/05-dependencies.md
      - "6. Compose Multiplatform cơ bản": lessons/06-compose-basics.md
      - "7. Resources và đa ngôn ngữ": lessons/07-resources.md
      - "8. ViewModel và điều hướng": lessons/08-viewmodel-navigation.md
      - "9. Đọc pin": lessons/09-battery.md
      - "10. GPS và xin quyền": lessons/10-location.md
      - "11. Mạng và đo độ trễ": lessons/11-network.md
      - "12. Lưu lịch sử với SQLDelight": lessons/12-history-sqldelight.md
      - "13. Test": lessons/13-testing.md
      - "14. Build và phát hành": lessons/14-build-publish.md
  - "Dự án Device Pulse":
      - project/index.md
      - "Code mẫu": project/source-code.md
      - "Checklist hoàn thành": project/checklist.md
  - "5 app luyện tập":
      - apps/index.md
      - "Khung chung & quy ước comment": apps/conventions.md
      - "1. Tip Split": apps/01-tip-split.md
      - "2. Pocket Notes": apps/02-pocket-notes.md
      - "3. Rate Watch": apps/03-rate-watch.md
      - "4. Trip Log": apps/04-trip-log.md
      - "5. OBD Link": apps/05-obd-link.md
  - "Đánh giá & kế hoạch":
      - plan/kmp-review.md
      - "Kotlin làm web": plan/kotlin-web.md
  - "Mở rộng":
      - "Học bền & thực chiến": extend/practice.md
  - "Tra cứu":
      - "Tài nguyên học chính chủ": reference/learning-resources.md
      - "Repo mẫu tham khảo": reference/sample-repos.md
      - "Bản đồ docs chính chủ": reference/docs-map.md
      - "Quy ước code Kotlin": reference/kotlin-conventions.md
      - "Máy thật & máy ảo": reference/devices.md
      - "Từ điển": reference/glossary.md
      - "Lỗi hay gặp": reference/troubleshooting.md

validation:
  links:
    not_found: warn
    unrecognized_links: info
