site_name: Học Kotlin Multiplatform
site_description: Học Kotlin Multiplatform bằng cách làm một app đo pin, GPS và mạng (Device Pulse) chạy Android và iOS — theo đúng lộ trình docs chính chủ của Kotlin.
site_url: https://tucarmd.github.io/kotlin-multi-platform/
repo_url: https://github.com/tucarmd/kotlin-multi-platform
repo_name: tucarmd/kotlin-multi-platform
edit_uri: edit/main/docs/
# Xem ở máy: mkdocs serve · Đăng: push main → GitHub Actions (.github/workflows/pages.yml)
docs_dir: docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  language: vi
  custom_dir: overrides
  font:
    text: Figtree
    code: JetBrains Mono
  icon:
    logo: material/language-kotlin
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Chế độ tối }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Chế độ sáng }

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.details
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - hooks/lesson_bar.py

plugins:
  - search

extra_css:
  - stylesheets/extra.css
  - stylesheets/app-shots.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tucarmd/kotlin-multi-platform
      name: Mã nguồn trên GitHub
    - icon: fontawesome/solid/book
      link: https://kotlinlang.org/docs/multiplatform/get-started.html
      name: Docs Kotlin Multiplatform chính chủ

